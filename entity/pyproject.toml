[project]
name = "entity"
version = "0.1.0"
description = "The project's reusable data-model Entities and their public Declarations."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "entity"
module-root = ""

[tool.ruff]
target-version = "py314"
