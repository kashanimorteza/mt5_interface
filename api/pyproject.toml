[project]
name = "api"
version = "0.1.0"
description = "The application's executable network boundary, serving every Group beneath its own URL segment."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "logic",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
api = "api.bootstrap:main"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.uv.sources]
logic = { path = "../logic" }

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"
module-root = ""

[tool.ruff]
target-version = "py314"
