engines:
  sqlite:
    name: "SQLite"
    driver: "sqlite"
    parameters:
      storage: "file"
      required_parameters: ["database"]
      foreign_keys: true
      connect_arguments:
        check_same_thread: false
  postgresql:
    name: "PostgreSQL"
    driver: "postgresql+psycopg"
    parameters:
      storage: "server"
      required_parameters: ["host", "port", "database", "username", "password"]
      default_port: 5432

instances:
  sqlite:
    name: "SQLite"
    active: true
    engine: "sqlite"
    host: null
    port: null
    database: "application.db"
    username: null
    password: null
    options: {}
  postgresql:
    name: "PostgreSQL"
    active: false
    engine: "postgresql"
    host: "127.0.0.1"
    port: 5432
    database: "application"
    username: "postgres"
    password: "123456"
    options: {}

settings:
  default_instance: "sqlite"
  storage_root: "db"
  query:
    filter_combination: "AND"
    default_limit: -1
    default_order:
      field: "id"
      direction: "ASCENDING"
  setup:
    after_generation:
      enabled: true
      fail_on_error: true
      command: "prepare"

