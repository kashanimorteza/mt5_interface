[project]
name = "logic"
version = "0.1.0"
description = "The application's Behavior, held in Services and published through one Interface."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "database",
    "entity",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.uv.sources]
database = { path = "../database", editable = true }
entity = { path = "../entity" }

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "logic"
module-root = ""

[tool.ruff]
target-version = "py314"
