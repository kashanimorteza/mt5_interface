[project]
name = "logic"
version = "0.1.0"
description = "The Logic library of MT5 Interface: the application's Behavior in its Services."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "metatrader5==5.0.6231 ; sys_platform == 'win32'",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "ty==0.0.89",
]

[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
