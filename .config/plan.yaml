        P1-G4:
          id: "P1-G4"
          title: "Interface publication"
          description: "The single entrypoint through which consumers reach the Entities, kept separate because it publishes the completed Entity units rather than defining any of them."
          area: "Interface: Entity Exports and Entity Collection"
          does: "Every Entity is published once by its own name and together in the Entity Collection, under the versioned Interface contract."
          constraints: []
          task_count: 1
          tasks:
            P1-G4-T1:
              id: "P1-G4-T1"
              source_id: "002"
              title: "Publish every Entity through the Interface"
              description: "Publish each realized Entity through an explicit Entity Export and all of them through the Entity Collection in Target order, and nothing else."
              reason: "Database, Logic, and Presentation reach Entities only through this published surface."
              inputs:
                - "Every realized Entity unit"
              skills: []
              expected_result: "A published Interface holding exactly one Entity Export per Target Entity and the Entity Collection in Target order."
              acceptance: "A consumer imports each of the seven Entities directly by its own name and enumerates an Entity Collection holding exactly those same Entities in Target order; each export is the actual Entity exposing its actual Declaration; nothing else is published; loading the Interface creates no instance, data, connection, file, or process."
              depends_on:
                - "P1-G3-T1"
                - "P1-G3-T2"
                - "P1-G3-T3"
                - "P1-G3-T4"
                - "P1-G3-T5"
                - "P1-G3-T6"
                - "P1-G3-T7"
              constraints: []
              status: "done"
              log:
                - {at: "2026-10-12T23:19:19Z", by: "003", event: "claimed", note: "Dependencies P1-G3-T1 to P1-G3-T7 are done."}
                - {at: "2026-10-12T23:20:00Z", by: "003", event: "done", note: "Published the Interface (entity/entity/interface.py): explicit imports of the seven Entities, __all__, and the entities tuple in Target order. Observed: the module exposes exactly the seven Entities and entities; each Collection item is the exported Entity itself; loading creates no Entity instance, thread, or file. ruff format, ruff check, and ty check pass across the Component after formatting the earlier output and fixing four lint findings (TypeError for type checks, Decimal(0)) and six type findings (SQLModelConfig, LiteralString casts)."}
        P1-G5:
          id: "P1-G5"
          title: "Documentation"
          description: "The Component's root documentation, kept separate because it describes the finished published surface for consumers rather than producing behavior."
          area: "Component root documentation"
          does: "A consumer can understand, set up, use, and verify the Entity library from its documentation alone."
          constraints: []
          task_count: 1
          tasks:
            P1-G5-T1:
              id: "P1-G5-T1"
              source_id: "002"
              title: "Document the Entity Component"
              description: "Write the Component's root documentation with its required sections, covering the published Interface, Declaration access, Foundation conversion, setup, use, verification, and troubleshooting."
              reason: "Consumers learn the Entity contract from its documentation without reading internals."
              inputs:
                - "The published Interface"
