                - {at: "2026-10-12T23:17:48Z", by: "003", event: "done", note: "Realized User (entity/entity/entity/user.py) from its Target definition; observed table user with uq_user_name and uq_user_username."}
            P1-G3-T2:
              id: "P1-G3-T2"
              source_id: "002"
              title: "Realize the Instance Entity"
              description: "Realize the Instance Entity from its Target definition."
              reason: "Instance carries the technical connection to MetaTrader 5 that Accounts use."
              inputs:
                - "The Target definition of Instance"
              skills:
                - "sqlmodel"
              expected_result: "An Instance Entity matching its Target definition."
              acceptance: "Instance's Declaration matches its Target definition in every Field, order, Type, nullability, default, and metadata, and its ownership Relation resolves to User."
              depends_on:
                - "P1-G2-T5"
                - "P1-G3-T1"
              constraints: []
