              acceptance: "Account's Declaration matches its Target definition in every Field, order, Type, nullability, default, and metadata, its decimal balance keeps its exact value through JSON text, and its Relations resolve to Account Group, Broker, Instance, and Currency."
              depends_on:
                - "P1-G2-T5"
                - "P1-G3-T2"
                - "P1-G3-T3"
                - "P1-G3-T4"
