                - {at: "2026-10-12T23:18:29Z", by: "003", event: "done", note: "Realized from its Target definition (entity/entity/entity/instance.py); it loads, and its table is instance with uq_instance_user_id_name and fk_instance_user_id."}
                - {at: "2026-10-12T23:18:29Z", by: "003", event: "decision", note: "Unset: which Target credential Fields carry which Sensitivity Marker. Chosen: password is marked password and api_key is marked sensitive; the technical username and ip are unmarked. Why: the Target declares password and api_key as credentials. The same mapping is applied to User and Account."}
