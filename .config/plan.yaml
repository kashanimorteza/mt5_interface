                - {at: "2026-10-13T00:01:28Z", by: "006", event: "done", note: "Wrote database/engine/sqlite.py with create(connection), which prepares the storage directory and builds the engine for the Instance's resolved file path, and run(engine, key, work), which runs work in one transaction. Observed with a temporary file Instance, run from the filesystem root as working directory: the file is created at its resolved path and foreign_keys reads 1; a failing statement raises ExecutionError carrying only the driver message; an unpreparable directory and an unopenable file raise ConnectionFailureError; no error has an attached original error."}
                - {at: "2026-10-13T00:01:28Z", by: "006", event: "decision", note: "Unset: how SQLite DDL and DML become atomic. Chosen: on connect the driver's own transaction handling is turned off (isolation_level None) and every SQLAlchemy begin emits BEGIN, so table creation and native schema changes roll back with their transaction. Why: Python's sqlite3 otherwise commits before DDL; verified that a failing create_all leaves no table."}
                - {at: "2026-10-13T00:01:28Z", by: "006", event: "decision", note: "Unset: how exact decimal text is compared and summed in SQLite. Chosen: each connection registers the collation exact_decimal (numeric Decimal comparison) and the aggregate exact_decimal_sum (unbounded-precision Decimal sum). Why: the Entity stores decimals as exact text; text comparison and SQLite's sum are not exact (observed: a 28-digit context lost digits)."}
