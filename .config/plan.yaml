          title: "Core routing"
          description: "The shared request path between the Interface and the Engine units: checking queries against the given Entity, resolving defaults and the selected Instance, forwarding work, and turning raw results into published forms. They are grouped because every Entity Operation and the Command Operation pass through this one path."
