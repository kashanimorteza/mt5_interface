            P6-G1-T4:
              id: "P6-G1-T4"
              source_id: "033"
              title: "Run every Terminal in its own Terminal Process"
              description: "Provide the layer that runs the Package for each Terminal in that Terminal's own operating-system process: opening a new Terminal starts its process, every later call for that Terminal runs inside it one after another, and shutting the Terminal down ends it."
              reason: "The Package holds one connection per process and is not safe for concurrent use, so Terminals must be kept apart while still working at the same time."
              inputs:
                - "The Package within the Logic library"
                - "MT5 Error"
              skills: []
              expected_result: "A Terminal Process layer that keeps one process per Terminal and runs each call in the process of its Terminal."
              acceptance: "Opening two different Terminals yields two distinct processes, neither of them the caller's; calls for one Terminal complete one after another in its process while calls for another Terminal proceed at the same time; shutting a Terminal down ends its process and leaves the other running; a call for a Terminal with no running process, other than opening it, raises MT5 Error; the Package is never loaded into the caller's own process."
              depends_on:
                - "P6-G1-T1"
                - "P6-G1-T2"
              constraints: []
              status: "done"
              log:
                - {at: "2026-10-14T09:55:22Z", by: "034", event: "claimed", note: "Dependencies P6-G1-T1 and P6-G1-T2 are done."}
                - {at: "2026-10-14T09:58:28Z", by: "034", event: "done", note: "Added the Terminal Process layer to logic/services/mt5/terminal.py: open(terminal, args, kwargs, failures) starts a spawned daemon process for a Terminal with none and runs the opening Function in it; call(terminal, function, args, kwargs, failures) runs a Function in the Terminal's process; each process imports the Package itself (import MetaTrader5 as mt5), serves one request at a time at an address derived from the Terminal path, converts results to Plain Data, turns a failure value into MT5Error from last_error, returns any Package exception unchanged, and exits after shutdown. ruff format, ruff check, and ty check pass. Observed on this Linux host with a scratch stand-in Package on the path (the real Package cannot run here): two Terminals got two distinct processes, neither the caller's; three concurrent calls per Terminal ran strictly one after another while the two Terminals ran at the same time (six 0.4 s calls in 1.27 s); a second caller process spawned from the same process tree reached the same Terminal Process; shutdown ended A's process and left B running; a later call for A raised MT5Error -10004; a failure value raised MT5Error with last_error's code and message; a failed first opening raised MT5Error -6 and ended its process; the stand-in Package never entered the caller's sys.modules; no process or socket file remained. Without any Package, opening raised MT5Error -10003 naming the ModuleNotFoundError; a stale socket left by a killed process was cleared and the Terminal opened over it."}
                - {at: "2026-10-14T09:58:28Z", by: "034", event: "decision", note: "Unset: how one Terminal Process stays reachable from several caller processes (OQ-033-3, API's workers). Chosen: the process listens at a local address derived from a SHA-256 of the Terminal path (a named pipe on Windows, a Unix socket in the temp directory elsewhere) and accepts only callers holding the process tree's multiprocessing authkey, which spawned API workers inherit. Why: every later call for a Terminal must run in its one process whichever caller process sends it, and the key keeps processes outside the tree from sending requests."}
                - {at: "2026-10-14T09:58:28Z", by: "034", event: "decision", note: "Unset: what happens to a newly started process when the opening Function fails. Chosen: it ends, so the Terminal has no running process and later calls raise MT5Error. Why: a Terminal that failed to open must not keep a process; a re-opening that fails on an already open Terminal keeps it."}
                - {at: "2026-10-14T09:58:28Z", by: "034", event: "decision", note: "Unset: the MT5Error code when no Package call could report one (no running process, startup timeout, Package not loadable, process ended mid-call). Chosen: the Package's own last_error codes RES_E_INTERNAL_FAIL_CONNECT -10004, RES_E_INTERNAL_FAIL_TIMEOUT -10005, RES_E_INTERNAL_FAIL_INIT -10003, and RES_E_INTERNAL_FAIL_RECEIVE -10002. Why: callers then read every MT5 Service failure in the Package's own code space."}
                - {at: "2026-10-14T09:58:28Z", by: "034", event: "decision", note: "Unset: the process start method and lifetime. Chosen: spawn, daemon processes. Why: spawn is the only method on Windows and keeps the caller's state out of the Terminal Process; a daemon process ends with the caller process that started it instead of blocking its exit."}
