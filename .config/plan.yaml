              id: "P1-G3-T1"
              source_id: "002"
              title: "Realize the User Entity"
              description: "Realize the User Entity from its Target definition."
              reason: "User owns every other user-scoped record, so it is the target of every ownership Relation."
              inputs:
                - "The Target definition of User"
              skills:
                - "sqlmodel"
              expected_result: "A User Entity matching its Target definition."
              acceptance: "User's Declaration matches its Target definition in every Field, order, Type, nullability, default, and metadata, and User carries no Relation."
              depends_on:
                - "P1-G2-T5"
              constraints: []
              status: "done"
