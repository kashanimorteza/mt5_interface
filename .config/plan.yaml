                - {at: "2026-10-13T00:04:22Z", by: "006", event: "done", note: "Wrote database/core/data.py: configuration() loads once; run(instance, work) resolves the default or selected DatabaseInstance, refuses a non-member (ConfigurationError) or an inactive Instance (InactiveInstanceError), creates and caches the Engine unit's engine, and runs work in one transaction; add, update, get_by_id, delete, set_active, list_entities, count, aggregate, and truncate validate input first and build every returned Entity with materialize (the Entity's own from_json over all Field values). Observed on a temporary store: add returns User id 1; update returns the stored Entity or None; disabling twice returns the final record; list without arguments orders by id ascending and with a Filter, a descending Order, and limit 1 returns one record; sum with no match returns 0; get and delete of a missing id return None; an Entity name string, a string Instance, a Field name string, a string limit, a string combination, a sum on text, an add with a stored id, and a string id are refused before storage is touched; a stored row with text in a float Field raises DeclarationMismatchError naming only the Field."}
