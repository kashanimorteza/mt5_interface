                - {at: "2026-10-12T23:18:29Z", by: "003", event: "done", note: "Realized from its Target definition (entity/entity/entity/currency.py); it loads, and its table is currency with code VARCHAR(3), uq_currency_user_id_code and fk_currency_user_id; a four-letter code is rejected."}
