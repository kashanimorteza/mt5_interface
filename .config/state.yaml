          pages: "112/114 over the 7 Entity Pages: columns, orders, and filters only for non-sensitive Fields by Field Label; rows exactly as API lists them with related names; active-state icons and icon switches with no text; views without sensitive Fields; add forms with every Field, typed inputs, read-only immutable and generated Fields, related choices by name, and refusal of exactly the required Fields; edit forms filled with empty sensitive inputs. The two misses checked that a stored secret is absent from the User and Account views where the stored secrets are empty strings, a probe artifact; the lifecycle run observed it with real secrets."
          lifecycle: "19/19 on Broker, User, and Asset: add, edit, disable, enable, and delete through API with the page showing each result; duplicate add and referenced delete shown as API's ExecutionError; secrets accepted, never shown in list, view, or edit form, and kept when the edit leaves them empty; orders in both directions and a search sent to API with the table listing API's result; the AND/OR choice hidden with one condition, shown with two, hidden again; a missing Field Label shown as the Field name."
          data_provider: "10/10: list with Filters, OR combination, and Orders, paged with its total from count; get_by_id, add, update, enable, disable, and delete through their Endpoints and Methods; duplicate, unknown Field, and referenced delete reach the caller with API's type and detail."
          documentation: "README.md has Overview, Setup, Use, Verify, and Troubleshooting in order, states the English default, Persian, and dark and light modes, where a Field Label is edited and that generation keeps it, the setup steps, and holds no URL Key or real credential."
        observations:
          - "The type generator, which fetches API's description when types are generated, lives in presentation/scripts rather than presentation/api; it sends no request at run time, so the runtime boundary holds, but its place is noted for the Human."
          - "The full-screen frame applies the theme's background token to html, body, and the root element from a shell Component rather than a CSS Module; Presentation Preferences allow custom styles only as CSS Modules and say appearance comes from Design Tokens. No Plan acceptance or Review observation names this, so it is noted, not a Finding."
          - "That nothing is published or installed outside the project (P5-G1-T1) was observed only as far as npm ci installing into the project directory."
          - "All runtime checks ran in jsdom, as headless Chromium lacks a system library here; jsdom needed the Document global added for column-header clicks, a harness gap only."
          - "Every check used an isolated Database copy; the real Database store was not touched."
