      data:
        findings:
          F1:
            state: "resolved"
            baseline: "P5-G1-T1 acceptance: the API address is read from one setting and appears nowhere in source. P5-G3-T1 acceptance: no Endpoint or field absent from the description appears in the generated types. Review observation: only API Access communicates with API, and its address comes from one setting."
            expected: "The generated API types hold no part of the Base URL, including its URL Key, in any form."
            observed: "The generated API types contained the URL Key, with its non-word characters turned into underscores, 357 times: in every request-body schema name (Body_<operation>_<URL Key>_entity_<entity>_<operation>_<method>) and every reference to those schemas. API derives these names from the full path; the generator rewrote only the paths, and the earlier key-free check looked only for the key's exact text."
            location: "presentation/api/schema.d.ts (components.schemas and their references), written by presentation/scripts/generate-api.mjs"
            resolution: "presentation/scripts/generate-api.mjs now removes the Base URL path in its underscore form from every name API derives from it, refuses output in which two schema names would coincide, and refuses to write types that still hold any segment of the Base URL path in either form; api/schema.d.ts was regenerated. Recheck: the raw and the derived key occur 0 times; schema names such as Body_add_entity_account_add_post; the only difference from the previous types is the removed key text; one typed path per Endpoint and one type per schema the description lists; generating again is byte-identical; tsc passes and the build has no warning."
        checks:
          technical: "Clean npm ci from the lockfile in an isolated copy (243 packages), npm ls with no problem, tsc strict, build with no warning in the copy and in place, dev server serving the application; no untyped value, no direct TanStack Query use, no runtime import of the Entity Component; only api/dataProvider.ts calls fetch at run time."
          generation: "Metadata against the Entity Collection and Declarations, Field Labels per language, and API types against API's description: 89/89. Metadata, Field Labels, routes, and the 7 Entity Page units regenerate byte-identical; a hand-edited label is kept and a missing one gets its readable default (Active, API Key; فعال, کلید API)."
