    - id: "037"
      skill: "my-interface-review"
      phase: "P6"
      event: "review"
      outcome: "not satisfied"
      started_at: "2026-10-14T10:55:28Z"
      completed_at: "2026-10-14T11:14:44Z"
      duration: "19:16"
      skills_used:
        - name: "my-interface-review"
          report: "Reviewed P6 against its Plan and the Logic, MT5 Service, API, and MT5 Group Review categories."
        - name: "fastapi"
          report: "Guided the reading of MT5 Group's Adapters and API's served description."
      open_questions: []
      blockers:
        - "B-037-1"
      report: "First review of P6 (MT5, Logic and API), judged against the current P6 Plan (18 done Tasks) and the Review categories of Logic (5 observations), MT5 Service (9), API (12, with the Group contract), and MT5 Group (6). Two Findings. F1 was raised and resolved: a Terminal Process outlived the API worker that started it, because uvicorn re-raises SIGTERM after its graceful shutdown, so a restarted API answered opening that Terminal with AuthenticationError; each Terminal Process now ends as soon as the process that started it ends, and the recheck shows no process or address left after API stops, a restarted API opening and calling the Terminal, and a killed caller taking its Terminal Process with it. F2, missing evidence, stays open as Blocker B-037-1: nothing in the record observes the real MetaTrader5 package or Windows, because this Linux aarch64 host cannot install it, so P6-G2-T2's acceptance, MT5 Service's Plain Data and MT5 Error observation with real results, and the Windows path of P6-G1-T1, P6-G1-T4, and P6-G8-T1 are not established. Everything observable here holds: locks, locked installs, builds, ruff format, ruff check, and ty check in Logic and API; zero-diff regeneration of every generated unit; Entity Group and Entity Service unchanged against HEAD; all 32 methods matching the documentation's syntax blocks; all 32 Handlers only calling their Function; the 223 Constants matching the package source; and the running API with 2 workers serving 117 Endpoints as documented. Outcome: not satisfied. P6 review progress set to not satisfied."
      data:
        findings:
          F1:
            state: "resolved"
            baseline: "P6-G2-T1 acceptance: opening a Terminal starts its Terminal Process. P6-G1-T4 acceptance: a call for a Terminal with no running process, other than opening it, raises MT5 Error. MT5 Service Review observation: every call runs in the Terminal Process of its Terminal."
            expected: "Once the API that started a Terminal Process stops, a newly started API can open that Terminal (starting its own Terminal Process) and calls for it run there or raise MT5Error."
            observed: "A Terminal Process outlives the API worker that started it: after API was stopped normally, process 53347 (started by worker 53334) kept running with the Terminal's address, reparented to init. A newly started API then answered both opening and calling that Terminal with 500 application/problem+json type AuthenticationError (digest sent was rejected), because the new process tree holds a different authkey; no Terminal Process was started and no MT5Error was raised. Cause: uvicorn re-raises the captured SIGTERM after its graceful shutdown (uvicorn/server.py capture_signals), so the worker dies by the default handler and multiprocessing never terminates its daemon children."
            location: "logic/services/mt5/terminal.py (_serve and _start: a Terminal Process ends only through shutdown or its caller's normal interpreter exit); observable through POST <base_url>/mt5/python_integration/initialize after an API restart."
            resolution: "logic/services/mt5/terminal.py: _serve starts a daemon thread running _end_with, which waits on multiprocessing.parent_process().sentinel and, when the process that started the Terminal Process ends, removes its Unix socket address (off Windows) and exits the Terminal Process. API's environment was refreshed with uv sync --locked --reinstall-package logic. The -10004 causes in the MT5 Service, Logic, and API documentation now include the opening process having ended. Recheck: open a Terminal through API and stop API: no Terminal Process and no address remain; a newly started API opens and calls the same Terminal (200, its own Terminal Process); a caller killed with SIGKILL takes its Terminal Process and address with it and the Terminal reopens; the Terminal Process, Function Group, result, served-API, worker, and documentation checks give the same results as before; ruff format, ruff check, and ty check pass. The orphaned Terminal Processes 52654 and 53347, their resource tracker, and two stale socket files left by this Review's runs were removed."
          F2:
            state: "open"
            blocker: "B-037-1"
            kind: "missing evidence"
            baseline: "P6-G2-T2 acceptance (results equal the Package's, failures equal its last-error report); MT5 Service Review observation: every result is Plain Data with the Package's field names and values, and every Package failure raises MT5 Error with last_error; P6-G1-T1 acceptance as it holds on the deployment platform; P6-G1-T4 and P6-G8-T1 acceptance on Windows, where Terminal Processes use named pipes."
            expected: "Observable results from the real MetaTrader5 package and a MetaTrader 5 terminal on Windows."
            observed: "The record shows no observation of the real package: this Linux aarch64 host cannot install it (PyPI publishes win_amd64 wheels only), every Package-dependent check in the Task Logs and in this Review used scratch stand-in packages, and the Windows named-pipe path of the Terminal Process layer has never run. This states what the record does not show, not that the conditions are unmet."
            location: "P6-G1-T1, P6-G1-T4, P6-G2-T2, P6-G8-T1 Task Logs; this host (Linux aarch64)."
        blockers:
          B-037-1:
            condition: "The real MetaTrader5 package and a MetaTrader 5 terminal cannot be observed on this host, so Review cannot establish the Package-dependent P6 conditions (F2)."
            evidence:
              - "uname: Linux aarch64; PyPI lists metatrader5 5.0.6231 only as win_amd64 wheels; Logic declares it with the marker sys_platform == 'win32', so it is not installed here."
              - "Opening a Terminal through the running API on this host answers 500 MT5Error -10003: The MetaTrader5 package cannot be loaded."
            required_human_action: "Run /my-interface-review 6 on the Windows Server deployment machine with uv sync done in logic/ and api/, a MetaTrader 5 terminal installed, and a demo account available, so Review can observe real results, failures, and the named-pipe Terminal Processes."
            scope: "P6 only; P1 to P5 are unaffected."
        checks:
          technical: "Logic and API: uv lock --check, uv sync --locked, ruff format --check (21 and 18 files), ruff check, ty check, and uv build all pass; the built wheels contain every MT5 unit; the locks record metatrader5 5.0.6231 and numpy 2.5.4 cp314 win_amd64 wheels under the win32 marker."
          inputs: "Logic Preferences' two Services and API Preferences' two Group References resolve to existing Definitions and Preferences; names and directories are unique (Entity/entity, MT5/mt5); the Package's cp314 wheel matches requires-python >=3.14; Platform Preferences select Windows Server, where the Package runs."
          regeneration: "From unchanged authorities the Function spec, PythonIntegration, Constants, both MT5 Adapters, and both MT5 READMEs regenerate byte-identical."
          phase_constraint: "Entity Group's 84 described Endpoints with their schemas and Entity Service's Interface and method signatures have the same digests at HEAD and now; no Entity Service or Entity Group unit differs from HEAD."
          logic: "Logic Interface publishes exactly Entity and MT5, each the identical Service Interface; no Service imports Logic Interface; only Entity Service imports Database; only MT5 Service's terminal unit imports the Package; importing starts no process and changes no Database file."
          mt5_service: "32 static methods equal the documentation's 32 Functions in name and order, and every parameter list equals the union of each Function's syntax blocks, with terminal first; with stand-in packages, parameters reach the Package unchanged in one Terminal Process per Terminal, calls for one Terminal run one after another and different Terminals at the same time, Package-shaped results become Plain Data, every documented failure value raises MT5Error with that Terminal's last_error, and the Package never loads in the caller; the 223 Constants equal the package's own source, whose compiled core defines no further Constant names; the Interface publishes PythonIntegration, Constants, and MT5Error only and opens no connection when loaded."
          api: "The running API (2 workers) serves 117 Endpoints, 84 Entity and 33 MT5, all beneath the URL Key and a Group segment, none of its own, every Method-and-Path combination unique; all MT5 Endpoints are POST /<Function> with Body Parameters, and the Constants Endpoint GET /get, per the verb table; MT5Error answers 500 application/problem+json with type MT5Error; Swagger UI and ReDoc answer, sectioned Entity and MT5 by Adapter; config.yaml holds every Structure value with derived url and documentation and a non-empty key; Bootstrap reads only config.yaml."
          mt5_group: "One Adapter for the one Function Group with 32 Endpoints plus the Constants Adapter returning 223 Constants; every Endpoint keeps its Function's parameter names, requirements, and defaults; all 32 Handlers only call their own Function through Logic Interface with every parameter; no class, loop, or generated route; no Package import."
          workers: "In a burst of slow calls both API workers held requests and every call answered 200, one after another, from one Terminal Process."
          documentation: "MT5 Service, Logic, MT5 Group, and API documentation keep their sections in order with resolving links; every example that needs no MetaTrader 5 terminal runs and prints as stated (the 33 MT5 Group Endpoint examples answered 200 with a stand-in); no URL Key or real credential appears."
        observations:
          - "MT5 Service's first Review observation says its Interface publishes one class per Function Group 'and nothing else', while its Interface contract also publishes Constants and MT5 Error; Review judged against the contract, which names all three."
          - "A process outside API's process tree (another authkey) that reaches a Terminal's address receives AuthenticationError rather than MT5Error; neither the Plan nor a Review observation covers such callers."
          - "When one caller process shuts down a Terminal another caller process started, the starter keeps a finished process object until its next start; nothing observable follows from it."
          - "The generators that make regeneration reproducible, the downloaded Package Documentation, and the stand-in packages live outside the project in the session's scratch space, as in earlier phases."
          - "Every API run used the live Database store only for read-only Entity counts and lookups."
