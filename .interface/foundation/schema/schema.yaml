schema:
  id: "agent-interface-preferences"
  version: "7.0"
  purpose: "The common structure every Component Preferences file follows. It defines selected values, supported alternatives, settings, declarations, and optional Agent parameters without deciding Target-specific meaning."

# <!--------------------------------------------------------------------------------- Frame -->
frame:
  source: ".interface/foundation/schema/yaml.yaml"
  inherited: "A Preferences file is a YAML Interface file, so it already has the common YAML frame: meta, policy, resolution, read_order, content_map, content. This schema does not redefine that frame and never repeats it."
  scope: "This schema defines the structure of Preferences content and states the additional expectations placed on the inherited meta and policy sections."
  path: ".interface/implementation/<subsystem>/<component>/<component>.yaml for each Implementation Component, and .interface/executor/<component>/<component>.yaml for each Executor Component."
  ownership: "The file is human-owned. Operations read it and never write resolved choices back into it."

# <!--------------------------------------------------------------------------------- Purpose -->
purpose:
  answers: "What is selected, supported, and preferred. A Component Preferences file records the choices, alternatives, settings, declarations, and conventions owned by its Component."
  relation_to_principles: "Principles state what is mandatory; Preferences state what is preferred. A Preference can never override a Principle."
  relation_to_project: "An explicit value in the human project definition always wins. This file is consulted only where the project is silent."
  resolution: "A choice recorded here is resolved when an operation runs, from this file together with the current project definition. Nothing here is copied into an operational record."

# <!--------------------------------------------------------------------------------- Scope -->
scope:
  contains:
    - "Supported technologies, tools, libraries, engines, and their versions."
    - "The selected option for each decision the Component owns."
    - "Configuration values, naming conventions, paths, and declared resources belonging to the Component."
    - "Optional references from a technical option to Agent Skills that can guide work for that option."
  excludes:
    - "Mandatory rules, responsibilities, and boundaries, which belong to the Component's Principles."
    - "Project data such as Models, fields, phases, or initial data, which belong to the human project definition."
    - "Operational records such as Plans, Tasks, progress, or Workflow position, which belong to Config."
    - "A choice owned by another Component; that Component's own Preferences hold it."
  empty_component: "A Component with no technical choices still has a Preferences file with the full frame and all three content sections present and empty. The absence of choices is stated, never implied by a missing file or section."

# <!--------------------------------------------------------------------------------- Meta -->
meta:
  required_fields:
    path:
      required: true
      purpose: "The path of the file."
    path_note:
      required: true
      purpose: "The location, layer, and role of the file, naming the Component and stating that this is its Preferences layer."
    purpose:
      required: true
      purpose: "What this file's owner chooses, in one sentence."
    standard:
      required: true
      purpose: "The Interface standard the file belongs to."
    version:
      required: true
      purpose: "The version of this Preferences file, raised whenever its content changes meaning."
    updated:
      required: true
      purpose: "The date the file last changed."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  purpose: "Every Preferences file answers the same questions about how it is read, changed, and applied. A question with no substance for a Component is answered plainly rather than omitted."
  required_fields:
    agent_may_edit:
      required: true
      value: false
      purpose: "Preferences are human-owned; no operation writes to them."
    rule:
      required: true
      purpose: "How the file is treated: read without writing resolved choices back into it."
    changed_by:
      required: true
      purpose: "Who changes it, and what happens when a needed choice is missing."
    precedence:
      required: true
      purpose: "That an explicit project value and every applicable Principle take precedence over this file."
  additional_fields: "A Component may add policy statements of its own after the required ones, such as how an isolated environment is created and used. It never renames or removes a required one."


# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  purpose: "How this file's content becomes a decision when an operation runs. It describes the procedure for using the content and never states a preference. A question with no substance for this owner is answered plainly rather than omitted."
  required_fields:
    consumption:
      required: true
      purpose: "How an operation uses these entries when it resolves an unstated choice."
    selection:
      required: true
      purpose: "What to do when the project needs something this file does not list."
    version_resolution:
      required: true
      purpose: "How an unpinned version such as `latest` becomes a concrete one, and that an explicit concrete version is preserved."
    matching:
      required: true
      purpose: "How an entry here is matched to what the project states, and the order in which competing entries apply."



# <!--------------------------------------------------------------------------------- Structure -->
structure:
  common:
    - "settings"
    - "interface"
    - "architecture"
    - "development"
    - "documentation"
  rule: "Every Component carries the common sections that apply to it, in this order, under exactly these names. A Component adds sections of its own for subjects the common ones do not hold — Instances, Services, Groups — placed after settings and before documentation. A common section a Component has nothing for is omitted rather than left empty, except settings, which is always present."

# <!--------------------------------------------------------------------------------- Sections -->
sections:

  settings:
    required: true
    default: {}
    purpose: "The Component's identity — type, directory, package — and the defaults and conventions that belong to the Component as a whole rather than to its interface, architecture, development, or documentation."
    grouping: "By the parts the owner's Principles name in its Architecture, using exactly those names, when a setting belongs to one of them; otherwise one group per coherent subject."
    rules:
      no_repetition: "A setting never repeats a value stated in another section. It refers to it instead."
      resolved_or_stated: "A setting states a concrete value, or an explicit marker that the value is supplied elsewhere, such as by the runtime environment or by the engine's own default."
      no_secrets: "A setting may name where a secret is read from; it never contains the secret value."
      declared_resources: "A resource the Component declares, such as a named instance, is recorded with its identity and configuration, in settings or in a section of its own."
      no_new_authority: "A setting supplies a preference only. It never introduces a mandatory rule, changes Target intent, or claims a choice owned by another Component."
    empty: "An empty mapping when the Component configures nothing."

  interface:
    required: false
    purpose: "The names and versions through which the Component's public boundary is realized: the Schema it conforms to and its version, and the names of its published symbols. The shape of that boundary belongs to the Component's Definition or its Schema; this section only names it."

  architecture:
    required: false
    purpose: "The physical names of the directories and files the Component's Architecture tree shows."

  development:
    required: false
    purpose: "How the Component is built: its development capabilities, the selected language with each language's realization profile — naming, symbols, method names, packages and their versions — and every other technical choice. Everything a language, package, or tool decides lives here and nowhere in the Definition."
    selection: "A choice with alternatives is written with the selection pattern: `selected` naming one entry of its `options`."
    conventions: "A code-level or realization convention — how something is written rather than which value it takes — belongs here, under the language or choice it governs."

  documentation:
    required: false
    purpose: "The documentation file, its location and format, the order of its sections, and what each section contains."

# <!--------------------------------------------------------------------------------- Selection Pattern -->
selection_pattern:
  purpose: "How any section writes a choice that has alternatives: one `selected` key naming the choice in force and one `options` catalogue listing every supported alternative. It is used wherever a choice is made, most often inside development."
  shape: |
    <choice>:
      selected: "<key of one entry in options>"
      options:
        <key>: { ... }
  note: "The rules below were written when selected and options were top-level sections. They now apply to every use of the pattern."
  former_sections:
    selected:
      required: true
      default: {}
      purpose: "The Component's selected default technical profile: package identity and code path when owned, selected technologies and resolved version constraints, selected declared resources, and concise high-level contract choices used when the Target is silent."
      rules:
        what_belongs: "Only the compact resolved profile belongs here: Component-owned identity and code path, one entry for each selected alternative or declared resource, its explicit version constraint when needed, and high-level choices required to interpret the profile as one coherent selection."
        names_an_option: "A value selecting an alternative is written as that option's exact key and the entry exists in the matching options catalogue. A value selecting a declared resource resolves to exactly one entry in settings."
        one_per_decision: "A decision appears here exactly once, under a key naming the kind of thing chosen, such as the language, the library, or the engine."
        no_detailed_configuration: "Operational configuration, field defaults, resource bodies, and layer settings do not belong here; they remain in settings."
        no_code_level_detail: "Typing APIs, framework usage rules, quality tools, mapping mechanics, and other code-level realization conventions belong to settings, grouped with the part of the Component they govern."
        no_repetition: "A selected entry may reference or summarize another section but never copies a detailed option or setting body."
      empty: "An empty mapping when the Component chooses nothing."

    options:
      required: true
      default: {}
      purpose: "What this file's owner supports. The alternatives available for each decision, so that a reader can see the full set rather than only the chosen one."
      shape: "One mapping per kind of top-level alternative, named in the plural, each holding entries keyed by the option's name. An option may contain embedded subordinate profiles when those choices exist only within that parent, such as one language's environment or API framework."
      entry:
        version:
          required: "Only for a versioned technology or definition."
          purpose: "The version of a versioned option: a concrete version, `latest` when it is resolved at implementation time, or `runtime-provided` when the environment supplies it. A conceptual option with no meaningful version omits this field."
        attributes:
          required: false
          purpose: "The properties that belong to this option alone, such as its package, driver, conventions, or capabilities."
        compatibility:
          required: false
          purpose: "Other options this one works with, named by their keys in their own catalogues."
        subordinate_profiles:
          required: false
          purpose: "Choices whose meaning and availability depend on this parent option, represented inside the parent rather than as unrelated top-level catalogues."
          shape: "A singular key names each resolved subordinate kind and contains its name, version when applicable, option-owned attributes, and its own Agent parameters when it has any."
          rules:
            ownership: "Nest a choice only when it has no independent meaning outside its parent. A reusable cross-language or cross-owner choice remains in its own owning catalogue or Component."
            resolution: "Selecting the parent resolves each embedded subordinate profile unless an explicit project value replaces that subordinate choice."
            recursion: "The Agent parameter rules defined for an option entry apply identically to every embedded subordinate profile, which may carry its own."
      rules:
        no_decision: "An option entry describes an alternative; it never states that it is the chosen one. Adding an entry never changes what is selected."
        no_project_data: "An option entry carries no Models, fields, records, or other project data."
        self_contained: "An entry describes only itself. A value shared by every option of a kind belongs to `settings`."
        agent_parameters: "An entry may carry the Agent parameters — `agent_consider`, `agent_avoid`, and `agent_skills` — beside its own fields. They are defined once in the Agent Parameters section of this schema and an option entry carries them under the same rules as any other item."
        conditional_agent: "An option's Agent parameters apply only after that top-level or embedded option is resolved as selected; an unselected option contributes nothing to the Agent."
      empty: "An empty mapping when the Component supports no alternatives."


# <!--------------------------------------------------------------------------------- Agent Parameters -->
agent_parameters:
  purpose: "The Human's message to the Agent about one item: what to take into account when working with it, what not to, and which Agent Skills help. It is how the Human's own judgment reaches the Agent at the exact place it applies, so that the same Preferences produce the same work whichever model performs it."
  placement: "Written directly beside the item's own fields, at any depth, in any of the three content sections. They are not gathered under a wrapper key: the Agent reads the whole file, so a wrapper would add nesting without adding meaning, and the name `agent` is left free for a Component that owns it as a declaration of its own."
  naming: "Each parameter name begins with `agent_`, so that it is distinguishable at a glance from the item's own fields and never collides with one — an item may carry both its own `skills` and `agent_skills`, meaning different things."
  scope: "Any item may carry any of them. A Language Item may carry one, one of its Technical Purposes another, and each package under that Purpose another again; each is a separate message about a separate thing."
  authority: "A preference the Agent reads before it decides, and follows wherever nothing outranks it. Where it conflicts with an explicit Target statement or any applicable Principle, that authority wins and the conflict is reported rather than resolved silently. It never becomes a mandatory rule, and it never expands Target scope or claims a choice another Component owns."
  accumulation: "Every Agent parameter on the path to an item applies together. When two of them speak to the same point, the nearest one — the parameter on the most specific item — governs that point, and everything the others say that it does not contradict still applies."
  activation: "A parameter on an option applies only once that option is resolved as selected. A parameter on an item in `selected` or `settings` is already in force."
  extensibility: "The parameters below are the current set, not a closed one. One the Human has nothing to say under is omitted, and the Agent passes over it. A new one is added here, under the same `agent_` naming, when a kind of message the Human needs to send has no place among these."
  distinct_from_native: "A `native.<agent-native>` block says how an Agent Native realizes a declaration; an Agent parameter says how the Agent should do the work. They answer different questions and neither is written inside the other."
  parameters:

    agent_consider:
      required: false
      purpose: "What to take into account while working with this item: a standard to follow, a class or function to prefer, the shape the Human wants the work to take."
      shape: "A list of statements, or a mapping when grouping them helps a reader. The wording is the Human's own; this schema fixes no vocabulary for it."

    agent_avoid:
      required: false
      purpose: "What not to take into account, and what not to do with this item: a class not to reach for, a route not to take, a habit not to bring from elsewhere."
      shape: "The same as `agent_consider`."

    agent_skills:
      required: false
      purpose: "Agent Skills associated with work on this item, not defined or installed here."
      shape:
        type: "list"
        item:
          resource:
            required: true
            purpose: "The associated Skill's portable name, resolved by ordinary operations against currently discoverable and usable Runtime Skills. A Runtime may expose a Skill under a namespaced identifier; match the declared name against the Skill's own name within that identifier rather than requiring an exact string match."
          requirement:
            required: true
            values:
              - "optional"
              - "required"
            purpose: "Whether selected work may continue without the referenced Skill and, when required, whether complete application of its applicable guidance is a completion gate."
          activation:
            required: true
            value: "when_selected"
            purpose: "Makes the association relevant only when the item carrying it is resolved as selected."
          purpose:
            required: true
            purpose: "The bounded guidance this Skill contributes while work on the selected item is performed."
      rules:
        association_only: "An association neither defines nor installs a Skill and never proves Activation. A declared Skill reaches the Runtime through Agent Native Implement or through its own ecosystem's provisioning mechanism, and current Runtime evidence proves whether it is usable."
        order: "When more than one Skill is associated, list order expresses the Human's preference order. Order never makes a later Skill optional or an earlier one required; each entry keeps its own declared requirement."
        authority: "An associated Skill supplies guidance only. It never selects this option, expands Target scope, or overrides Target, Principles, Preferences, Plan, Role, Permission, or another owning authority."
        optional: "Use an optional associated Skill when it is declared, discoverable, and usable. If it is unavailable, continue without it and report the unavailable aid when consequential."
        required: "A required associated Skill is a completion gate on conformance, not on availability. When it is usable, it is invoked through its realized Runtime mechanism and its complete applicable guidance is applied and verified under the owning Component's Principles before affected work is complete. When it is not usable, the work continues and the unavailability is reported, so provisioning can be retried by preparing the project again or through the Agent capability lifecycle."

# <!--------------------------------------------------------------------------------- Conventions -->
conventions:
  placeholders: "A value that is completed at resolution time is written in angle brackets, such as `<project>` or `<role>`. A key in angle brackets describes the shape of future entries rather than one real entry."
  unresolved: "A choice that the project must make and this file cannot supply is written as `to be defined`, and the executor that meets it proceeds with its own proposal and records the decision."
  read_order: "`read_order` lists the content sections the file carries, in the order the file carries them."
  content_map: "`content_map` carries exactly one line per content section the file carries, naming what that section holds for this file's owner."
