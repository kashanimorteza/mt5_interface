schema:
  id: "agent-interface-plan"
  version: "8.5"
  purpose: "Operational Plan file structure. Sections describe stored content; initial is the empty specialized content. Planning fills actual Plans, Groups, and Tasks using the Plan Component."
initialization:
  source: "initial"
  purpose: "Supply the initial specialized Plan content. Configure combines it with the general YAML Schema; no project facts or project interpretation are needed."
  defaults: "Every section and field declares a default. Fixed required objects expand their child defaults; empty collections stay empty."
  collections: "Keys enclosed in angle brackets describe future records. Do not create placeholder Plans, Groups, or Tasks during initialization."
  optional_fields: "Optional fields remain absent until applicable. A null default on an optional field means no value is recorded."
  drafts: "Empty strings and zero order values are unfilled record defaults. Before storing usable planning work, the owning operation supplies real identifiers, required descriptive content, and valid phase order."
  preservation: "Initialization does not overwrite an existing Config file or reset its operational data."
generation:
  purpose: "File-specific values Configure supplies while applying the general YAML file structure."
  path: ".config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."
  agent_may_edit: true
  policy_rule: "Apply the current Plan Component and the active operation's ownership rules."
  resolution:
    consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
    selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
    absence: "No matching Plan means no current planning record exists for that phase."
  read_order: ["task_count", "plans"]
  content_map:
    task_count: "Total number of stored Tasks."
    plans: "Current phase Plans and their Groups and Tasks."
operational_scope:
  purpose: "This file records the current state of the project's work. It is an operational record, not a description of the project."
  stores: "Which work exists, what each activity must produce, what it depends on, where it stands, and what has happened to it."
  excludes: "Planning content excludes project concepts, resolved technical choices, technologies, languages, Component rules, and explanations already held by authoritative sources. Execution logs may name actual technologies, commands, and locations as historical evidence, never as the source of current technical choices."
  resolution: "Anything derivable from those sources is resolved from them at the moment the work is implemented, never read back from this file."
  constraints: "A constraint is stored only when specific to the planned work and derivable from no other source, such as a scope boundary introduced by its decomposition into activities. Store it once at the level it binds. This field does not authorize Planning to choose technologies, design interfaces, prescribe implementation, or invent domain requirements."
inheritance:
  purpose: "A Plan, its Groups, and their Tasks form one nested structure, and that nesting is the context of every record beneath it."
  context: "A Task's phase is the Plan that contains it and its Group is the Group that contains it. Neither is stored inside the Task; the nesting and the Task identifier carry them."
  placement: "Every piece of context this file holds is stored exactly once, at the highest level where it holds: the targeted Component in the Plan, the work area in the Group, and a constraint at whichever of the three levels it holds for — the Plan when it binds the whole phase, the Group when it binds one work area, the Task when it binds one activity."
  resolution: "A Group inherits the Plan's context and a Task inherits both. A lower level may add to inherited context or make it stricter; it never repeats it and never contradicts it. Reading a Task means reading it together with its Group and Plan."
  duplication: "The same statement never appears in more than one Task of a Plan. A statement written into several Tasks belongs to their common Group or Plan and is stored there instead."
structure_independence:
  purpose: "Planning content describes responsibilities, behavior, and observable results; execution logs retain the concrete evidence of work performed."
  excluded: "No file, folder, path, module, package layout, class, function, symbol, or command is stored in planning content, and planning content never asserts an artifact's location. Task logs may contain actual checks, relevant locations, and observed results without secret values."
  target_and_area: "target and area identify a Component and a responsibility inside it, not a directory."
  sources: "Planning content stores no list of sources to consult. Understanding is established from the current Interface and Target authorities and the applicable Implementation Definitions and Preferences."
structure:
  - "task_count"
  - "plans"
sections:
  task_count:
    required: true
    default: 0
    purpose: "A non-negative integer equal to the total number of Tasks stored across all phase Plans, regardless of status. Sum the phase task_count values; use zero when no Tasks exist. Recalculate whenever Tasks are added or removed, including reconciliation and reset."
  plans:
    required: true
    default: {}
    purpose: "Phase Plans created by Planning, keyed by phase identifier; empty before any phase is planned."
    fields:
      "<phase>":
        required: false
        default: {}
        purpose: "One Plan keyed by its phase identifier. It carries the phase's identity and the Component targeted by the whole phase."
        fields:
          id:
            required: true
            default: ""
            purpose: "The phase identifier represented by this Plan."
          title:
            required: true
            default: ""
            purpose: "The phase title represented by this Plan."
          order:
            required: true
            default: 0
            purpose: "The phase's one-based position in project order."
          target:
            required: true
            default: ""
            purpose: "The Component targeted by the phase. Inherited by every Group and Task in this Plan and never repeated in them."
          does:
            required: true
            default: ""
            purpose: "The intended implementation outcome of the phase, in one statement."
          constraints:
            required: true
            default: []
            purpose: "Restrictions and invariants that bind every Task of this phase, are specific to the work, and are derivable from no other source; empty when none apply, which is the normal case. Stated as observable boundaries. Inherited by every Group and Task in this Plan and never repeated in them."
          task_count:
            required: true
            default: 0
            purpose: "A non-negative integer equal to the number of Tasks stored across all Groups in this phase Plan, regardless of status. Sum the Group task_count values; use zero for an empty Plan. Recalculate whenever Tasks are added or removed."
          groups:
            required: true
            default: {}
            purpose: "The ordered mapping of Groups that decompose the Plan, keyed by Group identifier; empty before the phase is planned."
            fields:
              "<group>":
                required: false
                default: {}
                purpose: "One coherent area of related work, keyed by its id. It carries the work area shared by its Tasks and inherits the target from its Plan."
                fields:
                  id:
                    required: true
                    default: ""
                    purpose: "The Group identifier, unique across all Plans. It carries the identifier of the Plan that contains it."
                  title:
                    required: true
                    default: ""
                    purpose: "A concise name for the work area."
                  description:
                    required: true
                    default: ""
                    purpose: "What belongs to the Group and why its Tasks are related."
                  area:
                    required: true
                    default: ""
                    purpose: "The responsibility or subsystem inside the Plan's target Component covered by the Group, named by responsibility rather than by location. Inherited by every Task in this Group."
                  does:
                    required: true
                    default: ""
                    purpose: "The result produced when every applicable Task in the Group is complete."
                  constraints:
                    required: true
                    default: []
                    purpose: "Restrictions and invariants that bind every Task of this work area but not the whole phase, are specific to the work, and are derivable from no other source; empty when none apply, which is the normal case. Stated as observable boundaries. Inherited by every Task in this Group and never repeated in them."
                  task_count:
                    required: true
                    default: 0
                    purpose: "A non-negative integer equal to the number of Tasks currently contained in the Group, regardless of status, including replaced Tasks while they remain stored. Recalculate whenever Tasks are added or removed."
                  tasks:
                    required: true
                    default: {}
                    purpose: "Tasks keyed by identifier. Every key equals its Task id. Dependencies, not mapping order, determine execution eligibility."
                    fields:
                      "<task>":
                        required: false
                        default: {}
                        purpose: "One Task: the activity that belongs to it alone, the result it must produce, how that result is proven, and its mutable progress."
                        fields:
                          id:
                            required: true
                            default: ""
                            purpose: "The Task identifier, unique across all Plans. It carries the identifiers of the Plan and Group that contain it, so the Task can be named unambiguously outside this file without storing its phase and Group again."
                          source_id:
                            required: true
                            default: ""
                            purpose: "The State Log Entry identifier of the Planning invocation that created or last materially changed this Task."
                          title:
                            required: true
                            default: ""
                            purpose: "A concise statement of the atomic action."
                          description:
                            required: true
                            default: ""
                            purpose: "A complete explanation of what must be done, expressed as responsibility and behavior without naming files, paths, or code, and without restating rules that current Interface, Target, and Implementation authorities already state."
                          reason:
                            required: true
                            default: ""
                            purpose: "Why the Task is necessary."
                          inputs:
                            required: true
                            default: []
                            purpose: "The information, interfaces, or completed results consumed by the Task, named by what they are rather than where they are stored; empty when none apply."
                          skills:
                            required: true
                            default: []
                            purpose: "The Skills Planning identifies as useful for completing this Task, named by stable Skill key; empty when none are identified. This guidance helps Develop choose a suitable Skill but does not limit Develop to this list. It is distinct from source_id, which identifies the Planning invocation that created or changed the Task."
                          replaces:
                            required: false
                            default: null
                            purpose: "The identifier of an earlier developed Task this new Task replaces; absent unless Planning created this Task to replace earlier work. The earlier Task remains stored and Develop marks it replaced when the relationship takes effect."
                          expected_result:
                            required: true
                            default: ""
                            purpose: "The concrete behavior, capability, state, or observable result the Task must produce."
                          depends_on:
                            required: true
                            default: []
                            purpose: "The identifiers of Tasks whose completed outputs are prerequisites; empty when the Task is independent."
                          constraints:
                            required: true
                            default: []
                            purpose: "Restrictions and invariants specific to this Task alone and derivable from no other source, stated as observable boundaries; empty when none apply, which is the normal case. A restriction stated by a current Interface, Target, or Implementation authority is resolved from its own source and is never copied here; one shared with another Task of the same Plan belongs to their Group or Plan instead."
                          acceptance:
                            required: true
                            default: ""
                            purpose: "The observable criterion that determines whether the intended result is correct."
                          status:
                            required: true
                            default: "todo"
                            purpose: "The current Task progress value, updated by Develop during execution."
                            allowed:
                              - "todo"
                              - "claimed"
                              - "blocked"
                              - "done"
                              - "replaced"
                          blocker:
                            required: false
                            default: null
                            purpose: "The identifier of the current critical Blocker when the Task is blocked; absent otherwise. Resolution evidence and the resulting progress transition belong in the Task Log. A missing referenced State record does not itself establish resolution."
                          log:
                            required: false
                            default: []
                            purpose: "The append-only Task-local progress history; absent until the first recorded transition. Records meaningful transitions and verified Blocker resolution evidence when applicable. A choice made on the executor's own proposal because nothing had set it is recorded here as a decision: what was unset, what was chosen, and why. Concrete commands, technologies, and locations are allowed here as historical evidence, with secret values excluded; they are not planning prescriptions."
definitions:
  task_status:
    todo: "Defined and not started."
    claimed: "Claimed by an executor before work begins."
    blocked: "Waiting on the referenced critical Blocker."
    done: "Developed; whether acceptance holds is established by Review."
    replaced: "No longer executable because a newer Task identifies it through that Task's replaces field."
initial:
  task_count: 0
  plans: {}
