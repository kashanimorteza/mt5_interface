# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: .interface/executor/permission/permission.yaml
  path_note: The Preferences layer of the Agent Permission Component.
  purpose: File-edit approval, allow/ask/deny rules, protected sources, secret handling, and enforced guarantees.
  standard: Agent Project Interface
  version: '5.0'
  updated: '2026-10-06'

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: This file is human-owned and contains no credential or secret values.
  changed_by: The human, directly.
  precedence: Human authorization, every applicable Principle, deny rules, and stricter managed controls take precedence.


# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: Read the content sections in read_order.
  selection: selected names one option per category.
  version_resolution: No entry carries a version.
  matching: Rules use portable capability patterns; Agent Native Implement resolves their Native syntax.
  probes: Each required enforced guarantee carries one behavioral probe; a blocking guarantee may also carry an allow_probe for an action it must not block.


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
- selected
- options
- settings

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: Current file-edit approval choice.
  options: Supported file-edit approval choices.
  settings: Rules, protected sources, secret handling, and enforced guarantees with their failure defaults.

# <!--------------------------------------------------------------------------------- Content -->
content:
  selected:
    file_edit_approval: not_required
  options:
    file_edit_approvals:
      not_required:
        meaning: Apply ordinary project file edits without per-edit confirmation while preserving explicit ask and deny rules.
      per_edit:
        meaning: Confirm every project file edit before it is applied.
  settings:
    rules:
      allow:
      - shell_execute
      - file_read
      - file_discover
      - text_search
      - file_edit
      - file_write
      - notebook_edit
      - agent_delegate
      - task_record
      - web_fetch
      - web_search
      - skill_invoke(declared or project-provisioned Skills)
      - file_read(declared or project-provisioned Skill files)
      deny: []
      ask:
      - shell_execute(git commit:*)
      - shell_execute(git push:*)
      - shell_execute(git reset:*)
      - shell_execute(git restore:*)
      - shell_execute(git checkout:*)
      - shell_execute(git rebase:*)
      - shell_execute(git clean:*)
    protected_sources:
      protected_root: .interface/
      mutation: deny by default
      read_restrictions:
        agent_module:
          path: .interface/executor/
          default: deny
          consumers:
          - foundation.create-agent-native-implement
          invocation: direct-explicit-human-only
          grant_scope: exact expanded Human prompt only; non-transferable
          effect: The Agent Native, every Agent Instance, Skill, coordinator, Hook, lifecycle routine, automation, model-generated action, and Understanding workflow consumes realized Runtime artifacts
            and cannot initiate Agent Native Implement.
      future_paths: Protected automatically.
    secrets:
      logging: redact
      output: redact
    enforced:
      failure_defaults:
        security_and_integrity: fail_closed
        notification_only: fail_open
      interface-boundary-guard:
        guarantee: Block Executor Module reads outside the exact direct-Human Agent Native Implement prompt, block every non-Human attempt to invoke Agent Native Implement, and block every direct Interface mutation.
        event: before every read, search, write, edit, shell, or Skill action
        blocking: true
        effects: Reject the action and return the boundary message.
        failure_policy: fail_closed
        required: true
        probe:
          action: From an Agent Instance outside the Agent Native Implement prompt, read a file inside the Executor Module and search inside it; then edit the Interface entry file.
          expect: All three are blocked with the boundary message, and no content is returned.
        allow_probe:
          action: From any Agent Instance, run a command that names only paths outside the Interface, including a name that merely contains "interface", such as importing `model.interface`.
          expect: The command is allowed.
      agent-native-read-grant:
        guarantee: Grant Executor Module read access only to the prompt created by the Human's direct explicit invocation of Agent Native Implement; a model, Agent Native, Agent Instance,
          Skill, coordinator, Hook, lifecycle routine, or automation can never create, inherit, or borrow this grant.
        event: when the Human directly invokes Agent Native Implement
        blocking: true
        effects: Record a session- and prompt-bound read grant, or reject the invocation.
        failure_policy: fail_closed
        required: true
        probe:
          action: Within the prompt created by the Human's direct Agent Native Implement invocation, read a file inside the Executor Module; then attempt the same read from an Agent Instance that prompt delegates to.
          expect: The first read succeeds; the delegated read is blocked, because the grant is non-transferable.
