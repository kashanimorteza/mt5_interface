# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/operations/configure/configure.yaml"
  path_note: "The Preferences layer of the Configure Component."
  purpose: "Configure declares the Config directory and the records generated from their Schemas."
  standard: "Agent Project Interface"
  version: "2.0"
  updated: "2026-09-20"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned."
  changed_by: "The human, directly."
  precedence: "The two Config Schemas and every applicable Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read the content sections in read_order."
  selection: "Follows Development's resolution order."
  version_resolution: "No entry carries a version."
  matching: "Each record matches its Schema by the mapping in settings.records."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "selected"
  - "options"
  - "settings"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "Empty. Configure selects no profile."
  options: "Empty. Configure supports no alternatives."
  settings: "The Config directory, the general YAML structure, and the generated record-to-Schema mappings."

# <!--------------------------------------------------------------------------------- Content -->
content:
  selected: {}
  options: {}
  settings:
    config_directory:
      path: ".config/"
    general_structure: ".interface/foundation/schema/yaml.yaml"
    records:
      - name: "Plan Config"
        file: "plan.yaml"
        schema: ".interface/foundation/schema/plan.yaml"
      - name: "State Config"
        file: "state.yaml"
        schema: ".interface/foundation/schema/state.yaml"
