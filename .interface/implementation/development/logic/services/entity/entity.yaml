# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/logic/services/entity/entity.yaml"
  path_note: "The Preferences layer of the fixed Entity Role inside the Logic Component."
  purpose: "Name, directory, the entities of architecture with the Interface contract, naming patterns, and documentation, and the language profile for Entity Service."
  standard: "Agent Project Interface"
  version: "8.0"
  updated: "2026-10-09"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Entity Service choices back into it."
  changed_by: "The human, directly."
  precedence: "Explicit Target meaning and every applicable Entity Service and Logic Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read the content sections in read_order."
  selection: "Preserve explicit compatible Target choices. Use these Preferences for choices the Target leaves unstated; for anything still unset, follow Development's resolution order."
  version_resolution: "This file declares no versioned technology."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - settings
  - architecture
  - development

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  settings: "The fixed Logic owner and Entity Role, and the configurable Service name and directory."
  architecture: "The entities of the Architecture tree — Interface with its contract version and the names of its own two groups, Entities with the Child naming patterns, and Documentation with its file, location, and format."
  development: "Development capabilities and the selected language with its realization profile."

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      role: logic
    service:
      role: entity
      name: Entity
      directory: entity

  # <!-------------------------------------------- architecture -->
  architecture:
    entities:
      interface:
        contract_version: '3.0'
        groups:
          service: Service
          model: Model
      entities:
        naming:
          child_file: <entity>
          child_structure: <entity>
      documentation:
        file: README.md
        location: the Entity Service directory
        format: markdown

  # <!-------------------------------------------- development -->
  development:
    capabilities:
      testing: false
      error_handling: false
      logging: false
    language:
      selected: "python"
      options:
        python:
          identifier_case: "snake_case"
          interface_file: "The Interface is the interface file at the Entity Service directory (logic/services/entity/interface.py); every __init__.py stays empty and publishes nothing."
          structure: "One class BaseEntity in the base file, with one explicitly written method per Action; no __getattr__ or other dynamic forwarding"
          constructor: "__init__ creates one database_interface() and keeps it on the instance"
          methods: "One method per database_interface method whose first parameter is entity, in the order Database Interface publishes them, with the method's exact name and docstring. An entity parameter typed as a class is removed and the bound Entity is passed in its place; an entity parameter typed as an instance stays and is checked against the bound Entity, raising InvalidInputError on a mismatch. Every other argument is passed unchanged, in order."
          child: "One file per Entity, directly in the Entity Service directory beside interface.py and base.py, holding class <Entity>(BaseEntity) with _entity = model.<Entity> from `from model import interface as model`, and only what is specific to that Entity."
          republish: "The interface file publishes two namespace classes named by architecture.entities.interface.groups: Service holds every Child class; Model holds the Entity each Child binds, under the Child's name. It also imports database_value, database_instance, and database_error from Database Interface and publishes them unchanged under their own names. The interface file holds only these imports, the two namespace classes, and the published list; it performs no check, because conformance belongs to Review."
