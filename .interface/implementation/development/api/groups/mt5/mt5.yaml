# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/api/groups/mt5/mt5.yaml"
  path_note: "The Preferences layer of MT5 Group inside the API Component."
  purpose: "Role, name, directory, the physical names of every part with the Adapter naming pattern, and the documentation of MT5 Group."
  standard: "Agent Project Interface"
  version: "3.0"
  updated: "2026-10-17"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved MT5 Group choices back into it."
  changed_by: "The human, directly."
  precedence: "Explicit Target meaning and every applicable MT5 Group Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read the content sections in read_order."
  selection: "Preserve explicit compatible Target choices. Use these Preferences for choices the Target leaves unstated; for anything still unset, follow Development's resolution order."
  version_resolution: "This file declares no versioned technology."
  matching: "An entry here applies to MT5 Group of the API Component. An explicit Target value replaces the matching entry here, and a more specific entry governs over a general one."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - settings
  - architecture
  - documentation

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  settings: "MT5 Group's role, configurable name, and directory."
  architecture: "The physical names of every part of the Architecture tree, the Adapter naming pattern, and the pattern of every Function's documentation link."
  documentation: "The documentation file, its location and format, and its sections in order."

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    group:
      role: mt5
      name: MT5
      directory: mt5

  # <!-------------------------------------------- architecture -->
  architecture:
    adapters:
      naming: <group>
    documentation_link: "https://www.mql5.com/en/docs/python_metatrader5/mt5<function without underscores>_py"
    constants: constants

  # <!-------------------------------------------- documentation -->
  documentation:
    file: README.md
    location: the MT5 Group directory
    format: markdown
    sections:
      - overview: "What MT5 Group is, in one paragraph, with one request example."
      - endpoints: "Every Function Group's Endpoints with Method, Path, and Parameters, each with one example."
      - use: "How a client calls an Endpoint, including the Terminal Parameter."
      - verify: "How to see that every Function has its Endpoint."
